<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4620" />
      <stop offset="60%" stop-color="#132A1C" />
      <stop offset="100%" stop-color="#0B1A11" />
    </linearGradient>
    <radialGradient id="accentGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8E24AA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#132A1C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bannerBg)" />
  <rect width="1600" height="600" fill="url(#accentGlow)" />

  <!-- Golden luxury borders -->
  <rect x="30" y="30" width="1540" height="540" rx="12" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Badge -->
  <g transform="translate(100, 110)">
    <rect width="220" height="36" rx="6" fill="#FDF3D7" />
    <text x="110" y="23" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#8A5A00" text-anchor="middle">★ BST ĐẶC QUYỀN</text>
  </g>

  <!-- Title -->
  <text x="100" y="230" font-family="'Lora', 'Playfair Display', serif" font-size="52" font-weight="700" fill="#FFFFFF">BỘ SƯU TẬP QUÀ TẶNG 20/10</text>
  <text x="100" y="290" font-family="'Be Vietnam Pro', sans-serif" font-size="22" font-weight="400" fill="#E6E1D6">Thay ngàn lời chúc tri ân gửi người phụ nữ yêu thương</text>

  <!-- CTA Button -->
  <g transform="translate(100, 360)">
    <rect width="220" height="56" rx="8" fill="#C82333" />
    <text x="110" y="35" font-family="'Be Vietnam Pro', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Khám Phá Bộ Sưu Tập →</text>
  </g>

  <!-- Graphic elements right side -->
  <g transform="translate(1250, 300)">
    <circle cx="0" cy="0" r="160" fill="#8E24AA" fill-opacity="0.2" stroke="#F5A623" stroke-width="2" />
    <circle cx="0" cy="0" r="120" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="0" y="35" font-size="120" text-anchor="middle">🍇</text>
  </g>
</svg>