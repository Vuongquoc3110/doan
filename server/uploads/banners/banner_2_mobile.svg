  <text x="400" y="630" font-family="'Be Vietnam Pro', sans-serif" font-size="18" font-weight="400" fill="#E6E1D6" text-anchor="middle">Thay ngàn lời chúc tri ân gửi người phụ nữ yêu thương</text>

