  <text x="400" y="850" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="500" fill="#8A5A00" text-anchor="middle">GIAO HÀNG HỎA TỐC 2H TRONG NỘI THÀNH</text>
